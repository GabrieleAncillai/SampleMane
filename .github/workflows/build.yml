name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.7'

jobs:
  build:
    name: Analyze, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test app
        run: flutter test

      - name: Test domain package
        run: dart test
        working-directory: packages/mane_core

      - name: Check formatting
        run: |
          find lib test packages/mane_core/lib packages/mane_core/test \
            -type f -name '*.dart' -not -name '*.g.dart' \
            -not -name 'app_localizations*.dart' -print0 \
            | xargs -0 dart format --line-length 110 --output=none --set-exit-if-changed

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            liblzma-dev \
            libavahi-client-dev \
            libavahi-gobject-dev \
            libdbus-1-dev \
            ninja-build \
            pkg-config

      - name: Build Linux debug bundle
        run: flutter build linux --debug

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mane-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
