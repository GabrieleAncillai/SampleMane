name: mane
description: "A local-first planner for personal life, work and home."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: 2.31.0
  sqlite3_flutter_libs: 0.5.42
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.0.1
  mane_core:
    path: packages/mane_core

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: 2.31.0
  build_runner: 2.15.1
  sqlite3: 2.9.4

flutter:
  uses-material-design: true
